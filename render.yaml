services:
  - type: web
    name: nexora-ai-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CORS_ORIGINS
        value: "*"
      - key: LOCAL_LLM_BASE_URL
        value: "http://localhost:11434"
      - key: LOCAL_LLM_MODEL
        value: "llama3"
